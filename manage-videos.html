<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Video - PP Nurul Ulum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            --color-primary: #6366F1;
            --color-primary-container: #E0E7FF;
            --color-on-primary: #FFFFFF;
            --color-surface: #FFFBFE;
            --color-surface-container: #F7EFF5;
            --color-on-surface: #1C1B1F;
            --color-on-surface-variant: #49454E;
            --color-outline-variant: #CAC7D0;
        }
    </style>
</head>
<body class="bg-surface text-on-surface">
    <div class="min-h-screen bg-gradient-to-br from-surface via-surface to-primary/5">
        <div class="container mx-auto px-4 py-8">
            <!-- Header -->
            <div class="mb-8">
                <h1 class="text-4xl font-bold text-on-surface mb-2">Kelola Video Pesantren</h1>
                <p class="text-on-surface-variant">Kelola 2 kategori video: Profil & Dokumenter, dan Suasana Kegiatan</p>
            </div>

            <!-- Tabs -->
            <div class="flex gap-2 mb-6 bg-surface-container rounded-lg p-1">
                <button onclick="switchTab('profile-documentary')" class="tab-button active px-6 py-3 rounded-md font-semibold transition-all" id="tab-profile">
                    📹 Profil & Dokumenter
                </button>
                <button onclick="switchTab('activity-documentary')" class="tab-button px-6 py-3 rounded-md font-semibold transition-all" id="tab-activity">
                    🎬 Suasana Kegiatan
                </button>
            </div>

            <!-- Content Area -->
            <div class="grid md:grid-cols-3 gap-8">
                <!-- Form Tambah/Edit Video -->
                <div class="md:col-span-1">
                    <div class="bg-white rounded-3xl border border-outline-variant/30 p-8 shadow-sm">
                        <h2 class="text-xl font-bold mb-6">
                            <span class="material-symbols-outlined align-middle mr-2">video_call</span>
                            Tambah Video
                        </h2>

                        <form id="videoForm" onsubmit="handleSubmit(event)" class="space-y-4">
                            <div>
                                <label class="block text-sm font-semibold mb-2">Judul Video</label>
                                <input type="text" id="videoTitle" placeholder="Masukkan judul video" class="w-full px-4 py-2 border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary" required>
                            </div>

                            <div>
                                <label class="block text-sm font-semibold mb-2">Deskripsi</label>
                                <textarea id="videoDescription" placeholder="Masukkan deskripsi video" rows="3" class="w-full px-4 py-2 border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
                            </div>

                            <div>
                                <label class="block text-sm font-semibold mb-2">File Video (MP4)</label>
                                <div class="border-2 border-dashed border-outline-variant rounded-lg p-4 text-center cursor-pointer hover:border-primary hover:bg-primary/5 transition-all" onclick="document.getElementById('videoFile').click()">
                                    <input type="file" id="videoFile" accept="video/mp4" class="hidden" onchange="handleFileSelect(event)">
                                    <span class="material-symbols-outlined block text-3xl text-on-surface-variant mb-2">upload_file</span>
                                    <p id="fileName" class="text-sm text-on-surface-variant">Klik untuk pilih file atau drag & drop</p>
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-semibold mb-2">Thumbnail (JPG/PNG)</label>
                                <div class="border-2 border-dashed border-outline-variant rounded-lg p-4 text-center cursor-pointer hover:border-primary hover:bg-primary/5 transition-all" onclick="document.getElementById('thumbnailFile').click()">
                                    <input type="file" id="thumbnailFile" accept="image/*" class="hidden" onchange="handleThumbnailSelect(event)">
                                    <span class="material-symbols-outlined block text-3xl text-on-surface-variant mb-2">image</span>
                                    <p id="thumbnailName" class="text-sm text-on-surface-variant">Klik untuk pilih thumbnail</p>
                                </div>
                            </div>

                            <div id="thumbnailPreview" class="hidden">
                                <img id="thumbnailImg" src="" alt="preview" class="w-full h-40 object-cover rounded-lg">
                            </div>

                            <div class="flex gap-2">
                                <button type="submit" class="flex-1 bg-primary text-on-primary py-2 rounded-lg font-semibold hover:bg-primary/90 transition-all flex items-center justify-center gap-2">
                                    <span class="material-symbols-outlined">add_circle</span>
                                    Tambah
                                </button>
                                <button type="button" onclick="resetForm()" class="flex-1 bg-surface-container text-on-surface py-2 rounded-lg font-semibold hover:bg-surface-container/80 transition-all">
                                    Reset
                                </button>
                            </div>
                        </form>

                        <div id="messageBox" class="mt-4 hidden p-3 rounded-lg text-sm font-semibold"></div>
                    </div>
                </div>

                <!-- Daftar Video -->
                <div class="md:col-span-2">
                    <div class="bg-white rounded-3xl border border-outline-variant/30 p-8 shadow-sm">
                        <h2 class="text-xl font-bold mb-6">
                            <span class="material-symbols-outlined align-middle mr-2">video_library</span>
                            <span id="categoryTitle">Profil & Dokumenter Pesantren</span>
                        </h2>

                        <div id="videoList" class="space-y-3">
                            <!-- Video items akan dimuat di sini -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentCategory = 'profile-documentary';
        let allVideos = [];
        let selectedVideoFile = null;
        let selectedThumbnailFile = null;

        // Load videos dari file JSON
        async function loadVideos() {
            try {
                const response = await fetch('/data/videos.json');
                allVideos = await response.json();
                renderVideoList();
            } catch (error) {
                console.error('Error loading videos:', error);
                showMessage('Gagal memuat data video', 'error');
            }
        }

        function switchTab(category) {
            currentCategory = category;
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active', 'bg-primary', 'text-white'));
            document.getElementById(`tab-${category === 'profile-documentary' ? 'profile' : 'activity'}`).classList.add('active', 'bg-primary', 'text-white');
            
            const categoryTitle = category === 'profile-documentary' ? 'Profil & Dokumenter Pesantren' : 'Video Profil & Suasana Kegiatan Pesantren';
            document.getElementById('categoryTitle').textContent = categoryTitle;
            
            renderVideoList();
        }

        function renderVideoList() {
            const list = document.getElementById('videoList');
            const filtered = allVideos.videos.filter(v => v.category === currentCategory);

            if (filtered.length === 0) {
                list.innerHTML = '<p class="text-on-surface-variant text-center py-8">Belum ada video di kategori ini</p>';
                return;
            }

            list.innerHTML = filtered.map(video => `
                <div class="bg-surface-container rounded-2xl p-4 flex gap-4 hover:shadow-md transition-all">
                    <img src="${video.thumbnail}" alt="${video.title}" class="w-24 h-24 rounded-lg object-cover flex-shrink-0">
                    <div class="flex-1">
                        <h3 class="font-bold text-sm">${video.title}</h3>
                        <p class="text-xs text-on-surface-variant">${video.description}</p>
                        <div class="flex items-center gap-4 mt-2 text-xs text-on-surface-variant">
                            <span class="material-symbols-outlined text-[16px] align-middle">schedule</span>
                            ${video.duration}
                            <span class="material-symbols-outlined text-[16px] align-middle">calendar_today</span>
                            ${new Date(video.uploadDate).toLocaleDateString('id-ID')}
                        </div>
                    </div>
                    <div class="flex gap-2 flex-shrink-0">
                        <button onclick="editVideo(${video.id})" class="p-2 hover:bg-primary/10 rounded-lg transition-all" title="Edit">
                            <span class="material-symbols-outlined text-primary">edit</span>
                        </button>
                        <button onclick="deleteVideo(${video.id})" class="p-2 hover:bg-red-100 rounded-lg transition-all" title="Hapus">
                            <span class="material-symbols-outlined text-red-500">delete</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function handleFileSelect(event) {
            selectedVideoFile = event.target.files[0];
            document.getElementById('fileName').textContent = selectedVideoFile.name;
        }

        function handleThumbnailSelect(event) {
            selectedThumbnailFile = event.target.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('thumbnailImg').src = e.target.result;
                document.getElementById('thumbnailPreview').classList.remove('hidden');
                document.getElementById('thumbnailName').textContent = selectedThumbnailFile.name;
            };
            reader.readAsDataURL(selectedThumbnailFile);
        }

        async function handleSubmit(event) {
            event.preventDefault();

            if (!selectedVideoFile || !selectedThumbnailFile) {
                showMessage('Silakan pilih file video dan thumbnail', 'error');
                return;
            }

            const title = document.getElementById('videoTitle').value;
            const description = document.getElementById('videoDescription').value;

            // Di sini seharusnya upload ke server, tapi untuk sekarang kita simulasikan
            const newVideo = {
                id: Math.max(...allVideos.videos.map(v => v.id), 0) + 1,
                category: currentCategory,
                categoryLabel: currentCategory === 'profile-documentary' ? 'Video Profil & Dokumenter Pesantren' : 'Video Profil & Suasana Kegiatan Pesantren',
                title: title,
                description: description,
                thumbnail: URL.createObjectURL(selectedThumbnailFile),
                videoUrl: URL.createObjectURL(selectedVideoFile),
                duration: '0:00',
                uploadDate: new Date().toISOString().split('T')[0]
            };

            allVideos.videos.push(newVideo);
            renderVideoList();
            resetForm();
            showMessage('Video berhasil ditambahkan!', 'success');
        }

        function editVideo(id) {
            const video = allVideos.videos.find(v => v.id === id);
            if (!video) return;

            document.getElementById('videoTitle').value = video.title;
            document.getElementById('videoDescription').value = video.description;
            document.getElementById('thumbnailImg').src = video.thumbnail;
            document.getElementById('thumbnailPreview').classList.remove('hidden');
            
            // Scroll ke form
            document.querySelector('.md\\:col-span-1').scrollIntoView({ behavior: 'smooth' });
        }

        function deleteVideo(id) {
            if (confirm('Apakah Anda yakin ingin menghapus video ini?')) {
                allVideos.videos = allVideos.videos.filter(v => v.id !== id);
                renderVideoList();
                showMessage('Video berhasil dihapus', 'success');
            }
        }

        function resetForm() {
            document.getElementById('videoForm').reset();
            document.getElementById('fileName').textContent = 'Klik untuk pilih file atau drag & drop';
            document.getElementById('thumbnailName').textContent = 'Klik untuk pilih thumbnail';
            document.getElementById('thumbnailPreview').classList.add('hidden');
            selectedVideoFile = null;
            selectedThumbnailFile = null;
        }

        function showMessage(text, type) {
            const box = document.getElementById('messageBox');
            box.textContent = text;
            box.className = `mt-4 p-3 rounded-lg text-sm font-semibold ${type === 'success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 3000);
        }

        // Load videos saat halaman dibuka
        loadVideos();

        // Tab styling
        document.querySelector('.tab-button.active').classList.add('bg-primary', 'text-white');
    </script>
</body>
</html>
